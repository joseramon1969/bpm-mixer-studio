[build]
  command = "vite build"
  publish = "dist/client"
[build.environment]
  NODE_VERSION = "24"
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 3000
  port = 8889

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
